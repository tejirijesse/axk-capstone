[project]
name = "axk_capstone"
authors = [{ name = "Oghenetejiri Jesse" }]
description = "AXK Network capstone: Stellar verification and settlement layer, chain explorer"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = ["stellar-sdk>=12,<14"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
